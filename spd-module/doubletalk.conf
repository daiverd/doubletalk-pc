# Required: supply the absolute path to your own 512 KiB DoubleTalk PC ROM.
DoubleTalkRomPath "/home/vlilmike/prog/doubletalk-pc/doubletalkpc.bin"

# Optional reconstruction low-pass corner, 500 through 5000 Hz.
# 3800 Hz best matches the MAME reference with the current band-limited
# emulator resampler. Use 3000 Hz for the darker datasheet analog corner.
DoubleTalkLowPassHz 3800

# Optional server-audio sample rate, 8000 through 192000 Hz.
# Resampling here avoids repeated conversion of the native 10504 Hz stream
# when Speech Dispatcher audio crosses PipeWire or a network tunnel.
DoubleTalkOutputRate 48000
